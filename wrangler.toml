# Cloudflare Pages + Pages Functions configuration.
# Keep this file aligned with the Pages project settings in Cloudflare.
name = "pendel-pilot"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-06"

# Access by invitation (README, "Access by invitation"): the KV namespace that holds the invitations.
# This id belongs to the Cloudflare account of the original Pendel-Pilot deployment. It is not a secret: it only
# works inside that account. If you fork and deploy Pendel-Pilot yourself, create your own namespace and put
# its id here, otherwise the deployment fails. While this file exists, bindings set in the dashboard are ignored.
[[kv_namespaces]]
binding = "ACCESS"
id = "761e34fd3a724eb7809938d4a269a02e"
