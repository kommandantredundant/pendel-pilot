<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <!-- NOINDEX: remove before the official release (see README, "Before the official release"). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Pendel-Pilot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a22" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Pendel-Pilot" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Apply the stored theme before first paint to avoid a light flash in dark mode.
      try {
        var theme = localStorage.getItem("pendelpilot.theme");
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // Browser bars follow the theme chosen in the app, not only the system setting (see lib/theme.ts).
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].content = dark ? "#161a22" : "#ffffff";
      } catch (e) {}

      // Some Android browsers (WebView based, e.g. DuckDuckGo, Hermit) report the status bar height
      // as safe-area-inset-top even when the page starts below the status bar or address bar.
      // Only trust the top inset when the page really covers the whole screen height.
      // The tallest viewport seen per orientation counts, so an open keyboard changes nothing.
      (function () {
        var root = document.documentElement, orientation = "", tallest = 0;
        function check() {
          var current = screen.width + "x" + screen.height;
          if (current !== orientation) { orientation = current; tallest = 0; }
          tallest = Math.max(tallest, window.innerHeight);
          root.classList.toggle("no-top-inset", screen.height - tallest > 8);
        }
        check();
        window.addEventListener("resize", check);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
